# Render.com deployment configuration for ForgeIQ
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to your repo root
#   2. In Render dashboard: New → Blueprint → connect your repo
#   3. Set environment variables in Render dashboard

services:
  # ── ForgeIQ Backend API ────────────────────────────────────────────────────
  - type: web
    name: forgeiq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./forgeiq.db
        # For PostgreSQL, use a Render Postgres database and set this to the connection string
      - key: AI_PROVIDER
        value: deterministic
      - key: CORS_ORIGINS
        # Replace with your actual Vercel/Netlify frontend URL after deploying:
        value: "https://your-app.vercel.app,https://your-app.netlify.app,http://localhost:3000,*"
      - key: STORAGE_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: "50"
      # Optional — only needed if AI_PROVIDER is "openai" or "anthropic":
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
